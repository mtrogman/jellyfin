name: Build & Publish Jellyfin Docker image (pragma tuning)

on:
  push:
    branches:
      - trog/sqlite-pragmas-10.11.5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        id: tags
        shell: bash
        run: |
          VERSION="10.11.5"
          SHORT_SHA="${GITHUB_SHA::7}"

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

          echo "TAG_VERSIONED=mtrogman/jellyfin:${VERSION}-pragma-tuning" >> $GITHUB_ENV
          echo "TAG_MOVING=mtrogman/jellyfin:pragma-tuning" >> $GITHUB_ENV
          echo "TAG_SHA=mtrogman/jellyfin:sha-${SHORT_SHA}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          push: true
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: |
            ${{ env.TAG_VERSIONED }}
            ${{ env.TAG_MOVING }}
            ${{ env.TAG_SHA }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
