name: Build test Jellyfin image (pragma)

on:
  push:
    branches:
      - trog/sqlite-pragmas-10.11.5
  workflow_dispatch:
    inputs:
      base_tag:
        description: "Upstream Jellyfin base image tag (e.g., 10.11.5)"
        required: false
        default: "10.11.5"
      tag_prefix:
        description: "Tag prefix (e.g., v10.11.5-pragma)"
        required: false
        default: "v10.11.5-pragma"

env:
  IMAGE_NAME: mtrogman/jellyfin

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set tags
        shell: bash
        run: |
          set -euo pipefail
          TS="$(date -u +%Y%m%d%H%M)"
          SHA="$(git rev-parse --short=10 HEAD)"

          BASE_TAG="${{ inputs.base_tag || '10.11.5' }}"
          TAG_PREFIX="${{ inputs.tag_prefix || 'v10.11.5-pragma' }}"

          echo "TS=$TS" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "BASE_TAG=$BASE_TAG" >> "$GITHUB_ENV"
          echo "TAG_PREFIX=$TAG_PREFIX" >> "$GITHUB_ENV"

          echo "FULL_TAG=${TAG_PREFIX}-${TS}" >> "$GITHUB_ENV"
          echo "FULL_TAG_SHA=${TAG_PREFIX}-${TS}-${SHA}" >> "$GITHUB_ENV"
          echo "LATEST_TAG=${TAG_PREFIX}-latest" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build & Push (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_TAG=${{ env.BASE_TAG }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.FULL_TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.FULL_TAG_SHA }}
            ${{ env.IMAGE_NAME }}:${{ env.LATEST_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
