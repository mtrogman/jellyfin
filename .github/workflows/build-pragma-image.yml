name: Build & Push Pragma Test Image

on:
  push:
    branches:
      - "trog/sqlite-pragmas-10.11.5"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute tags
        shell: bash
        run: |
          set -euo pipefail
          TS="$(date -u +%Y%m%d%H%M)"
          SHORT_SHA="$(git rev-parse --short=10 HEAD)"

          echo "TS=$TS" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"

          echo "IMAGE=mtrogman/jellyfin" >> "$GITHUB_ENV"
          echo "BASE=v10.11.5-pragma" >> "$GITHUB_ENV"
          echo "FULL_TAG=v10.11.5-pragma-${TS}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build & Push (amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            BASE_TAG=10.11.5
          tags: |
            ${{ env.IMAGE }}:${{ env.FULL_TAG }}
            ${{ env.IMAGE }}:${{ env.FULL_TAG }}-${{ env.SHORT_SHA }}
            ${{ env.IMAGE }}:v10.11.5-pragma-latest
