name: Build & Push Jellyfin (pragma test)

on:
  workflow_dispatch:

env:
  # Change if you want a different repo name under your DockerHub namespace
  IMAGE_NAME: jellyfin
  BASE_TAG: "10.11.5"
  PLATFORMS: linux/amd64

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set tags
        shell: bash
        run: |
          set -euo pipefail
          TS="$(date -u +%Y%m%d%H%M)"
          SHORT_SHA="${GITHUB_SHA::10}"

          echo "TS=${TS}" >> "${GITHUB_ENV}"
          echo "SHORT_SHA=${SHORT_SHA}" >> "${GITHUB_ENV}"

          echo "FULL_TAG=v${BASE_TAG}-pragma-${TS}" >> "${GITHUB_ENV}"
          echo "LATEST_TAG=v${BASE_TAG}-pragma-latest" >> "${GITHUB_ENV}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: |
            BASE_TAG=${{ env.BASE_TAG }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.FULL_TAG }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.FULL_TAG }}-${{ env.SHORT_SHA }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.LATEST_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
