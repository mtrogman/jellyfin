name: Build & Push Jellyfin Docker (pragma tuning)

on:
  push:
    branches:
      - 10.11.9
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jellyfin-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set vars
        shell: bash
        run: |
          echo "IMAGE_NAME=mtrogman/jellyfin" >> $GITHUB_ENV
          echo "IMAGE_TAG=10.11.9" >> $GITHUB_ENV
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # If you only care about amd64 for your lab, change to: linux/amd64
          platforms: linux/amd64,linux/arm64
          build-args: |
            JELLYFIN_BASE_TAG=10.11.9
            DOTNET_SDK_TAG=9.0
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
